<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація гаманця TON</title>
    <!-- Підключаємо Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Підключаємо TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px 20px; background: #0f172a; color: #fff; margin: 0; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; display: inline-block; max-width: 400px; width: 100%; box-sizing: border-box; }
        #ton-connect { margin: 20px 0; display: flex; justify-content: center; }
        .hidden { display: none; }
        button { background: #0098EA; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; }
        button:hover { background: #0082c4; }
        p { font-size: 14px; line-height: 1.4; color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Реєстрація гаманця</h2>
        <p id="welcome-text">Підключіть ваш гаманець TON:</p>
        
        <!-- Кнопка підключення гаманця TON -->
        <div id="ton-connect"></div>

        <div id="action-container" class="hidden">
            <button onclick="sendDataToBot()">Відправити дані в бот</button>
        </div>
        
        <p id="status" style="margin-top: 15px; color: #38bdf8;"></p>
    </div>

    <script>
        // Ініціалізація Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Автоматичне отримання ніка або імені з Telegram
        let tgUser = tg.initDataUnsafe?.user;
        let tgIdentifier = "";
        
        if (tgUser) {
            tgIdentifier = tgUser.username ? `@${tgUser.username}` : (tgUser.first_name || `id_${tgUser.id}`);
        } else {
            tgIdentifier = "@web_user";
        }

        // Ініціалізація TON Connect з вашим посиланням на GitHub Pages
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://providnykzpoun-bit.github.io/Wallet/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        let userWalletAddress = '';

        // Відстеження стану підключення гаманця
        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                userWalletAddress = wallet.account.address;
                document.getElementById('welcome-text').innerText = `Вітаємо, ${tgIdentifier}!\nГаманець успішно зчитано.`;
                document.getElementById('action-container').classList.remove('hidden');
                document.getElementById('status').innerText = '';
            } else {
                document.getElementById('action-container').classList.add('hidden');
                document.getElementById('welcome-text').innerText = "Підключіть ваш гаманець TON:";
                document.getElementById('status').innerText = '';
            }
        });

        function sendDataToBot() {
            if (!userWalletAddress) {
                alert('Спочатку підключіть гаманець!');
                return;
            }

            // Ваш бот: ReklamaPRua_bot
            const botName = "ReklamaPRua_bot"; 
            
            // Формуємо текст, який автоматично запропонує надіслати бот
            const messageText = `Реєстрація гаманця:\nНік: ${tgIdentifier}\nАдреса: ${userWalletAddress}`;
            
            // Перенаправлення у ваш бот із заготовленим текстом (або параметром start)
            window.location.href = `https://t.me/${botName}?text=${encodeURIComponent(messageText)}`;
        }
    </script>
</body>
</html>
