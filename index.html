<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Збір даних гаманця TON</title>
    <!-- Підключаємо Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Підключаємо TON Connect UI SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 30px 15px; background: #0f172a; color: #fff; margin: 0; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; display: inline-block; max-width: 420px; width: 100%; box-sizing: border-box; }
        #ton-connect { margin: 20px 0; display: flex; justify-content: center; }
        h2 { font-size: 20px; margin-bottom: 5px; }
        .subtitle { font-size: 11px; color: #94a3b8; margin-bottom: 15px; }
        p { font-size: 13px; line-height: 1.4; color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Збір даних гаманця</h2>
        <div class="subtitle">Wallet Data Collection / Сбор данных кошелька</div>
        
        <p id="welcome-text">
            Підключіть ваш гаманець TON:<br>
            <span style="font-size: 11px; color: #94a3b8;">Connect your TON wallet / Подключите кошелек TON</span>
        </p>
        
        <!-- Кнопка підключення гаманця TON -->
        <div id="ton-connect"></div>
        
        <p id="status" style="margin-top: 15px; color: #38bdf8; font-size: 12px;"></p>
    </div>

    <script>
        // Ініціалізація Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Автоматичне отримання ніка або імені з Telegram
        let tgUser = tg.initDataUnsafe?.user;
        let tgIdentifier = "";
        
        if (tgUser) {
            tgIdentifier = tgUser.username ? `@${tgUser.username}` : (tgUser.first_name || `id_${tgUser.id}`);
        } else {
            tgIdentifier = "@web_user";
        }

        // Налаштування головної системної кнопки Telegram (в самому низу екрана телефону)
        let mainButton = tg.MainButton;
        mainButton.setParams({
            text: "НАДІСЛАТИ ДАНІ В БОТ",
            color: "#0098EA",
            text_color: "#FFFFFF",
            is_visible: false
        });

        // Дія при натисканні на системну кнопку Telegram
        mainButton.onClick(function () {
            if (!userWalletAddress) {
                alert('Спочатку підключіть гаманець!');
                return;
            }

            const botName = "DaniUA_bot"; 
            const messageText = `Збір даних гаманця / Wallet Data:\nНік / User: ${tgIdentifier}\nАдреса / Address: ${userWalletAddress}`;
            
            // Запасний варіант через стандартну схему або відкриття через ссилку
            const tgLink = `https://t.me/${botName}?text=${encodeURIComponent(messageText)}`;
            
            // Закриваємо міні-додаток і переходимо в чат
            window.location.href = tgLink;
            tg.close();
        });

        // Ініціалізація TON Connect з вашим посиланням на GitHub Pages
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://providnykzpoun-bit.github.io/Wallet/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        let userWalletAddress = '';

        // Відстеження стану підключення гаманця
        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                userWalletAddress = wallet.account.address;
                document.getElementById('welcome-text').innerHTML = `Вітаємо, <b>${tgIdentifier}</b>!<br>Гаманець успішно зчитано.<br><span style="font-size: 11px; color: #94a3b8;">Натисніть синю кнопку внизу екрана для відправки!</span>`;
                
                // Показуємо системну синю кнопку Telegram внизу екрана
                mainButton.show();
            } else {
                mainButton.hide();
                document.getElementById('welcome-text').innerHTML = `Підключіть ваш гаманець TON:<br><span style="font-size: 11px; color: #94a3b8;">Connect your TON wallet / Подключите кошелек TON</span>`;
            }
        });
    </script>
</body>
</html>
